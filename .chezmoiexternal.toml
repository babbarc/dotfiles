# Chezmoi-managed mirror of this repo's single git submodule (.gitmodules):
# fzf-git.sh. The zsh (ohmyzsh), tmux (.tmux), and passfzf externals were
# removed - the shell is fish, the multiplexer is herdr, and passfzf is
# unused. fzf-git.sh is wired into fish via dot_config/fish/conf.d/fzf-git.fish.
# refreshPeriod = "168h" (1 week); `chezmoi update --refresh-externals` forces
# an earlier refetch.

["fzf-git.sh"]
    type = "git-repo"
    url = "https://github.com/junegunn/fzf-git.sh.git"
    refreshPeriod = "168h"
    clone.args = ["--depth", "1"]
