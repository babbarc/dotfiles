import = ["/home/USERNAME/.config/alacritty/catppuccin/catppuccin-mocha.toml"]

[font]
size = 11.0

[font.bold]
family = "DejaVuSansM Nerd Font"
style = "Bold"

[font.bold_italic]
family = "DejaVuSansM Nerd Font"
style = "Bold Oblique"

[font.italic]
family = "DejaVuSansM Nerd Font"
style = "Oblique"

[font.normal]
family = "DejaVuSansM Nerd Font"
style = "Regular"

[[keyboard.bindings]]
action = "ToggleFullscreen"
key = "F"
mods = "Command|Control"

[scrolling]
history = 10000

[shell]
program = "/usr/bin/tmux"
args = ["new-session", "-A", "-s", "main"]

[window]
decorations = "none"
dynamic_padding = false
dynamic_title = true

[window.dimensions]
columns = 160
lines = 70
